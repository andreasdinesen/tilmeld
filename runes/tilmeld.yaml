gameskill:
  id: tilmeld
  name: "Tilmeld"
  category: "Apps"
  description: "Event-tilmeldingssystem: bruger-, gruppe-admin- og master-admin-UI med tilmelding, deltagerlister, CSV-eksport, lyst/mørkt tema og passkey-login."
  author: "andreasdinesen"
  version: 15
  icon: "app"

  docker:
    image: "ghcr.io/andreasdinesen/tilmeld:{{IMAGE_TAG}}"
    user: "0:0"
    data_path: "/data"

  install:
    image: "ghcr.io/andreasdinesen/tilmeld:{{IMAGE_TAG}}"
    script: |
      mkdir -p /data
      echo "Tilmeld-image hentet. Tryk Start."

  # Egen "Opdater app"-knap, saa man ikke skal geninstallere serveren for at faa en
  # ny version. Panelet stopper appen, henter imaget FRISKT (docker pull), koerer
  # dette script i en midlertidig container og gen-skaber derefter app-containeren
  # fra det nye image - det er selve pull'et og gen-skabelsen, der opdaterer appen.
  #
  # App-koden ligger i imaget, ikke i datamappen, saa der er ingen filer at pakke ud
  # her (til forskel fra payload-baserede runer, der skal "rm -rf app" foerst).
  # /data - database og uploads - skal netop IKKE roeres.
  update:
    image: "ghcr.io/andreasdinesen/tilmeld:{{IMAGE_TAG}}"
    label: "Opdater Tilmeld"
    script: |
      set -eu
      mkdir -p /data
      ver=$(sed -n 's/^  version: *//p' /app/runes/tilmeld.yaml 2>/dev/null || true)
      echo "Tilmeld version ${ver:-ukendt} hentet."
      echo "Databasen i /data er uroert; skemaaendringer koeres naar appen starter."

  variables:
    # Gør app-versionen til et felt i panelet: "latest" følger med hver udgivelse,
    # "v12" laaser installationen til netop den version. Det er vejen tilbage, hvis
    # en udgivelse driller — uden at vente paa en ny.
    # NB: versions-taggene begynder ved v12; aeldre udgivelser findes kun som latest.
    #
    # Kun tagget er et felt, ikke hele image-adressen (til forskel fra {{NODE_IMAGE}}
    # i de oevrige runer, hvor man med rette skal kunne skifte selve runtime-imaget).
    # Her er imaget vores eget, og der er ingen grund til at kunne pege appen paa et
    # vilkaarligt image — moenstret tillader kun "latest" eller "v<tal>".
    #
    # Feltet maa ALDRIG staa tomt - panelet bruger IKKE default for en tom vaerdi
    # (yggdrasil @ddcf9d2; rune-schema.md:348/:388 lover det, koden goer det ikke):
    #  1. validateVar returnerer ok paa "" (internal/api/env_validate.go:61-63)
    #     FOER type- og pattern-tjekket (:65-113), saa moenstret afviser aldrig "".
    #  2. `required` haandhaeves ikke server-side (samme fil :57-60); det giver kun
    #     stjernen i formularen (web/src/components/VarForm.svelte:41).
    #  3. "" gemmes og vinder over default (create: handlers_servers.go:324-327,
    #     start/install: handlers_query_rcon.go:50-51), saa imaget bliver "...:"
    #     og pull/create fejler (handlers_servers.go:828-887, install.go:150-198).
    #     Install-scriptet koerer i samme image og naar aldrig at melde fejlen.
    # Derfor required (stjerne) og "aldrig tomt" i feltnavnet. Staar feltet tomt:
    # skriv latest, gem og tryk Restart.
    - key: IMAGE_TAG
      name: "App-version: latest (foelger nyeste) eller fx v12 for at laase/rulle tilbage - aldrig tomt, skriv latest hvis i tvivl"
      type: string
      required: true
      default: "latest"
      pattern: '^(latest|v[0-9]+)$'
      hint: "Skriv latest eller et versionsnummer som v12 - se versionsloggen i CHANGELOG.md"
    - key: MASTER_PASSWORD
      name: "Master-password (KUN ved allerførste opstart — skift derefter i appen under master → Opsætning)"
      type: string
      default: "skift-mig"
      required: true
    - key: MASTER_PASSWORD_RESET
      name: "Nulstil master-password: skriv et nyt her, genstart, log ind — og TØM feltet igen"
      type: string
      default: ""
    - key: TZ
      name: "Tidszone (bruges til datoer og frister)"
      type: string
      default: "Europe/Copenhagen"

  startup:
    command: "waitress-serve --listen=0.0.0.0:8080 app:app"
    done_regex: 'Serving on'

  ports:
    - { name: web, default: 8080, protocol: tcp }

  # Standard-overvaagning (Kvasir-watchers). Laegges ind ved oprettelse og ved
  # Reinstall - en eksisterende server faar dem foerst efter en Reinstall.
  watchers:
    # notifications.py og db.py skriver [MAIL-FEJL], [WHATSAPP-FEJL],
    # [SCHEDULER-FEJL] og [LOG-FEJL]. Hver linje er en besked, der ikke kom ud,
    # eller en paamindelsesrunde, der fejlede.
    - name: "Notifikationer eller baggrundsjob fejler"
      pattern: '\[[A-Z]+-FEJL\]'
      threshold: 1
      window_secs: 300
    # Flask logger en uhaandteret undtagelse som
    # "[tid] ERROR in app: Exception on /sti [GET]" + traceback - brugeren fik 500.
    - name: "Serverfejl (500)"
      pattern: 'ERROR in app: Exception on '
      threshold: 1
      window_secs: 300

  # Wipe = start forfra med en TOM database. Kun tilmeld.db og dens sidefiler
  # slettes. Appen koerer med SQLites standard-journal, saa den, der kan findes,
  # er -journal (efter et nedbrud hoerer en efterladt journal til den GAMLE
  # database og skal vaek sammen med den); -wal/-shm er med, hvis WAL slaas til.
  # Vaek er: alle grupper, events, tilmeldinger, brugere, passkeys og opsaetning
  # (SMTP, WhatsApp). Ved naeste start oprettes databasen igen, og
  # MASTER_PASSWORD gaelder paa ny (det er "allerfoerste opstart" igen).
  # uploads/ (brugernes billeder) roeres IKKE - de ligger tilbage uden noget,
  # der peger paa dem, og kan slettes under Files. Tag en backup foerst;
  # backup_first er dokumentation - panelet spoerger selv ved hver wipe.
  wipe:
    paths: ["tilmeld.db", "tilmeld.db-journal", "tilmeld.db-wal", "tilmeld.db-shm"]
    backup_first: true

  backup:
    include: ["."]
