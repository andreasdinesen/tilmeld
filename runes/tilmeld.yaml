gameskill:
  id: tilmeld
  name: "Tilmeld"
  category: "Apps"
  description: "Event-tilmeldingssystem: bruger-, gruppe-admin- og master-admin-UI med tilmelding, deltagerlister, CSV-eksport, lyst/mørkt tema og passkey-login."
  author: "andreasdinesen"
  version: 13
  icon: "app"

  docker:
    image: "ghcr.io/andreasdinesen/tilmeld:{{IMAGE_TAG}}"
    user: "0:0"
    data_path: "/data"

  install:
    image: "ghcr.io/andreasdinesen/tilmeld:{{IMAGE_TAG}}"
    script: |
      mkdir -p /data
      echo "Tilmeld-image hentet. Tryk Start."

  # Egen "Opdater app"-knap, saa man ikke skal geninstallere serveren for at faa en
  # ny version. Panelet stopper appen, henter imaget FRISKT (docker pull), koerer
  # dette script i en midlertidig container og gen-skaber derefter app-containeren
  # fra det nye image - det er selve pull'et og gen-skabelsen, der opdaterer appen.
  #
  # App-koden ligger i imaget, ikke i datamappen, saa der er ingen filer at pakke ud
  # her (til forskel fra payload-baserede runer, der skal "rm -rf app" foerst).
  # /data - database og uploads - skal netop IKKE roeres.
  update:
    image: "ghcr.io/andreasdinesen/tilmeld:{{IMAGE_TAG}}"
    label: "Opdater Tilmeld"
    script: |
      set -eu
      mkdir -p /data
      ver=$(sed -n 's/^  version: *//p' /app/runes/tilmeld.yaml 2>/dev/null || true)
      echo "Tilmeld version ${ver:-ukendt} hentet."
      echo "Databasen i /data er uroert; skemaaendringer koeres naar appen starter."

  variables:
    # Gør app-versionen til et felt i panelet: "latest" følger med hver udgivelse,
    # "v12" laaser installationen til netop den version. Det er vejen tilbage, hvis
    # en udgivelse driller — uden at vente paa en ny.
    # NB: versions-taggene begynder ved v12; aeldre udgivelser findes kun som latest.
    #
    # Kun tagget er et felt, ikke hele image-adressen (til forskel fra {{NODE_IMAGE}}
    # i de oevrige runer, hvor man med rette skal kunne skifte selve runtime-imaget).
    # Her er imaget vores eget, og der er ingen grund til at kunne pege appen paa et
    # vilkaarligt image — moenstret tillader kun "latest" eller "v<tal>".
    - key: IMAGE_TAG
      name: "App-version: latest (foelger nyeste) eller fx v12 for at laase/rulle tilbage"
      type: string
      default: "latest"
      pattern: '^(latest|v[0-9]+)$'
      hint: "Skriv latest eller et versionsnummer som v12 - se versionsloggen i CHANGELOG.md"
    - key: MASTER_PASSWORD
      name: "Master-password (KUN ved allerførste opstart — skift derefter i appen under master → Opsætning)"
      type: string
      default: "skift-mig"
      required: true
    - key: MASTER_PASSWORD_RESET
      name: "Nulstil master-password: skriv et nyt her, genstart, log ind — og TØM feltet igen"
      type: string
      default: ""
    - key: TZ
      name: "Tidszone (bruges til datoer og frister)"
      type: string
      default: "Europe/Copenhagen"

  startup:
    command: "waitress-serve --listen=0.0.0.0:8080 app:app"
    done_regex: 'Serving on'

  ports:
    - { name: web, default: 8080, protocol: tcp }

  backup:
    include: ["."]
