{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Filen er for stor</h1>
  <p>Der kan højst sendes <strong>{{ maks }} MB</strong> ad gangen. Prøv med en mindre fil —

</div>
{% endblock %}
