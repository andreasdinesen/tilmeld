name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runens version er appens ene versionsnummer (se CHANGELOG.md). Den bliver
      # ogsaa et image-tag, saa man kan laase en installation til en bestemt version
      # eller rulle tilbage via IMAGE_TAG-variablen i panelet.
      - name: Laes rune-version
        id: rune
        run: |
          v=$(sed -n 's/^  version: *//p' runes/tilmeld.yaml | head -1 | tr -d '"'"'"' ')
          case "$v" in
            ''|*[!0-9]*)
              echo "Kunne ikke laese en rune-version af runes/tilmeld.yaml (fik '$v')." >&2
              echo "Uden den ville vi udgive et tag der hed 'v' — stopper hellere her." >&2
              exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Rune-version: $v  ->  tag v$v"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ steps.rune.outputs.version }},enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
